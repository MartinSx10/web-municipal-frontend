<section class="max-w-6xl mx-auto px-6 py-10">
  <div class="flex items-end justify-between gap-4 flex-wrap">
    <div>
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-blue-700">
        Agenda municipal
      </p>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mt-2">
        Agenda y eventos
      </h1>
      <p class="text-slate-600 mt-2">
        Próximas actividades del municipio.
      </p>
    </div>

    <a routerLink="/" class="text-sm font-semibold underline underline-offset-4">
      Volver al inicio →
    </a>
  </div>

  <ng-container *ngIf="(events$ | async) as events">
    <div *ngIf="events.length === 0" class="mt-8 rounded-2xl border border-slate-200 bg-slate-50 p-6 text-slate-600">
      No hay eventos cargados todavía.
    </div>

    <div *ngIf="events.length > 0" class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
      <article
        *ngFor="let e of events"
        class="rounded-3xl border border-slate-200 bg-white shadow-sm hover:shadow-lg transition overflow-hidden"
      >
        <div class="relative h-44 bg-slate-200">
          <img
            *ngIf="e.coverUrl"
            [src]="e.coverUrl"
            [alt]="e.title"
            class="w-full h-full object-cover"
            loading="lazy"
          />
        </div>

        <div class="p-6">
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500">
            {{ e.startAt | date:'dd/MM/yyyy HH:mm' }}
          </p>

          <h3 class="mt-2 text-xl font-extrabold text-slate-900">
            {{ e.title }}
          </h3>

          <p class="mt-2 text-sm text-slate-700">📍 {{ e.location || '—' }}</p>
          <p class="mt-3 text-sm text-slate-600">
            {{ e.excerpt || 'Actividad programada por el municipio.' }}
          </p>

          <div class="mt-5">
            <ng-container *ngIf="eventLink(e) as link">
              <!-- externo -->
              <a
                *ngIf="link.external; else internal"
                [href]="link.url"
                target="_blank"
                rel="noopener noreferrer"
                class="text-sm font-semibold text-blue-900 underline underline-offset-4"
              >
                Ver detalle ↗
              </a>

              <!-- interno -->
              <ng-template #internal>
                <a
                  [routerLink]="link.url"
                  class="text-sm font-semibold text-blue-900 underline underline-offset-4"
                >
                  Ver detalle →
                </a>
              </ng-template>
            </ng-container>
          </div>
        </div>
      </article>
    </div>
  </ng-container>
</section>
