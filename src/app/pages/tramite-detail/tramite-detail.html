<section class="max-w-6xl mx-auto px-6 py-10">
  <ng-container *ngIf="(tramite$ | async) as t; else loadingTpl">
    <ng-container *ngIf="t; else notFoundTpl">
      <a routerLink="/tramites" class="text-sm font-semibold underline underline-offset-4">
        ← Volver a trámites
      </a>

      <div class="mt-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold">{{ t.title }}</h1>
        <p class="text-slate-600 mt-2">{{ t.subtitle || t.excerpt }}</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
        <div class="bg-white border rounded-2xl p-5">
          <p class="text-sm text-slate-500">📍 Lugar de atención</p>
          <p class="font-semibold mt-1">{{ t.place || '—' }}</p>
        </div>

        <div class="bg-white border rounded-2xl p-5">
          <p class="text-sm text-slate-500">🕒 Horarios</p>
          <p class="font-semibold mt-1">{{ t.schedule || '—' }}</p>
        </div>
      </div>

      <div class="mt-10">
        <h2 class="text-xl font-extrabold">Guía</h2>

        <article
          class="tramite-prose bg-white border rounded-2xl p-6 mt-4"
          [innerHTML]="renderMarkdown(t.notes || '')"
        ></article>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #loadingTpl>
    <p class="text-slate-600">Cargando trámite...</p>
  </ng-template>

  <ng-template #notFoundTpl>
    <p class="text-slate-700">No se encontró el trámite.</p>
  </ng-template>
</section>
