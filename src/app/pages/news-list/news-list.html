<div class="max-w-6xl mx-auto p-6">
  <div class="flex items-end justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold">Novedades</h2>
      <p class="text-gray-600 mt-1">Últimas noticias oficiales del municipio.</p>
    </div>
  </div>

  <!-- Buscador -->
  <div class="mt-6 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
    <div class="flex-1">
      <input
        type="text"
        [formControl]="search"
        placeholder="Buscar por título…"
        class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-200"
      />
    </div>

    <button
      type="button"
      (click)="search.setValue('')"
      class="px-4 py-3 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-sm"
    >
      Limpiar
    </button>
  </div>

  <!-- Indicador de búsqueda -->
  <p *ngIf="search.value.trim()" class="mt-3 text-sm text-gray-500">
    Mostrando resultados para:
    <span class="font-medium">"{{ search.value }}"</span>
  </p>

  <!-- Contenido -->
  <ng-container *ngIf="(news$ | async) as news; else loadingTpl">

    <!-- Empty state -->
    <div *ngIf="news.length === 0" class="mt-6 text-gray-600">
      <ng-container *ngIf="search.value.trim(); else emptyAll">
        No hay resultados para <span class="font-medium">"{{ search.value }}"</span>.
      </ng-container>

      <ng-template #emptyAll>
        No hay noticias publicadas todavía.
      </ng-template>
    </div>

    <!-- Lista -->
    <div *ngIf="news.length > 0" class="grid md:grid-cols-2 gap-6 mt-6">
      <article
        *ngFor="let item of news"
        class="bg-white rounded-xl shadow p-5 transition hover:shadow-lg"
      >
        <!-- Cover -->
        <img
          *ngIf="item.coverUrl"
          [src]="item.coverUrl"
          class="h-40 w-full object-cover rounded-lg mb-3"
          alt="Imagen de la noticia"
        />
        <div
          *ngIf="!item.coverUrl"
          class="h-40 w-full bg-gray-200 rounded-lg mb-3"
        ></div>

        <p class="text-xs text-gray-500">{{ item.publishedAt | date:'dd/MM/yyyy' }}</p>

        <h3 class="text-lg font-semibold mt-1">{{ item.title }}</h3>

        <p
          class="text-gray-600 text-sm mt-2 overflow-hidden text-ellipsis"
          style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;"
        >
          {{ item.excerpt }}
        </p>

        <a
          class="inline-block mt-4 text-sm font-medium text-blue-900 underline"
          [routerLink]="['/noticias', item.slug]"
        >
          Ver detalle
        </a>
      </article>
    </div>

  </ng-container>

  <!-- Skeleton -->
  <ng-template #loadingTpl>
    <div class="grid md:grid-cols-2 gap-6 mt-6">
      <div class="bg-white rounded-xl shadow p-5 animate-pulse" *ngFor="let _ of [1,2]">
        <div class="h-40 w-full bg-gray-200 rounded-lg mb-3"></div>
        <div class="h-3 w-24 bg-gray-200 rounded mb-2"></div>
        <div class="h-5 w-2/3 bg-gray-200 rounded mb-3"></div>
        <div class="h-4 w-full bg-gray-200 rounded mb-2"></div>
        <div class="h-4 w-5/6 bg-gray-200 rounded"></div>
      </div>
    </div>
  </ng-template>
</div>
