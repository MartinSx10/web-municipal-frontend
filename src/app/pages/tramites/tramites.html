<section class="max-w-6xl mx-auto px-6 py-10">
  <div class="flex items-end justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold">Servicios y trámites</h1>
      <p class="text-gray-600 mt-1">Guías, requisitos y accesos rápidos.</p>
    </div>

    <a routerLink="/" class="text-sm font-medium text-blue-900 underline underline-offset-4">
      Volver al inicio
    </a>
  </div>

  <ng-container *ngIf="(tramites$ | async) as items">
    <div *ngIf="items.length === 0" class="mt-8 text-gray-600">
      Todavía no hay trámites cargados.
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
      <a
        *ngFor="let t of items"
        class="bg-white rounded-2xl shadow p-6 hover:shadow-lg transition"
        [routerLink]="['/tramites', t.slug]"
      >
        <div class="flex items-start gap-4">
          <div class="text-3xl leading-none">{{ t.icon || '📄' }}</div>

          <div class="min-w-0">
            <h3 class="font-semibold text-lg leading-snug">{{ t.title }}</h3>
            <p class="text-sm text-gray-600 mt-1">{{ t.subtitle || t.excerpt }}</p>

            <span class="inline-block mt-4 text-sm font-medium text-blue-900 underline">
              Ver guía
            </span>
          </div>
        </div>
      </a>
    </div>
  </ng-container>
</section>
