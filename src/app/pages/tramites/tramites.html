<section class="max-w-6xl mx-auto px-6 py-10">
  <div class="flex items-end justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold">Servicios y trámites</h1>
      <p class="text-gray-600 mt-2">Guías, requisitos y accesos rápidos.</p>
    </div>

    <a routerLink="/" class="text-sm font-semibold underline underline-offset-4 hover:opacity-90">
      Volver al inicio
    </a>
  </div>

  <ng-container *ngIf="(tramites$ | async) as list; else loadingTpl">
    <div *ngIf="list.length === 0" class="mt-8 text-gray-600">
      Todavía no hay trámites cargados.
    </div>

    <div *ngIf="list.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
      <a
        *ngFor="let t of list"
        class="group bg-white rounded-2xl shadow-sm border border-slate-100 p-6 hover:shadow-lg transition"
        [routerLink]="['/tramites', t.slug]"
      >
        <div class="flex items-start justify-between gap-4">
          <div class="flex items-start gap-4 min-w-0">
            <div class="w-12 h-12 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center text-xl">
              {{ t.icon || '📄' }}
            </div>

            <div class="min-w-0">
              <h3 class="text-lg font-bold leading-snug truncate">
                {{ t.title }}
              </h3>
              <p class="text-sm text-slate-600 mt-1 line-clamp-2">
                {{ t.subtitle || t.excerpt || 'Ver guía y requisitos' }}
              </p>
            </div>
          </div>

          <span class="text-sm font-semibold text-slate-700 group-hover:text-blue-900">
            Ver →
          </span>
        </div>

        <div class="mt-5 pt-5 border-t border-slate-100 flex items-center justify-between gap-4 text-sm">
          <div class="text-slate-600 truncate">
            📍 {{ t.place || 'Municipalidad' }}
          </div>
          <div class="text-slate-600 truncate">
            🕒 {{ t.schedule || 'Consultar' }}
          </div>
        </div>
      </a>
    </div>
  </ng-container>

  <ng-template #loadingTpl>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-pulse" *ngFor="let _ of [1,2,3]">
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 rounded-2xl bg-slate-200"></div>
          <div class="flex-1">
            <div class="h-5 bg-slate-200 rounded w-3/4"></div>
            <div class="h-4 bg-slate-200 rounded w-full mt-3"></div>
            <div class="h-4 bg-slate-200 rounded w-5/6 mt-2"></div>
          </div>
        </div>
        <div class="h-px bg-slate-100 mt-6"></div>
        <div class="flex justify-between gap-4 mt-4">
          <div class="h-4 bg-slate-200 rounded w-1/2"></div>
          <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        </div>
      </div>
    </div>
  </ng-template>
</section>
