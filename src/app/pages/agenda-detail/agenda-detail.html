<section class="max-w-6xl mx-auto px-6 py-10">
  <a routerLink="/agenda" class="inline-flex items-center gap-2 font-semibold underline underline-offset-4">
    ← Volver a agenda
  </a>

  <ng-container *ngIf="(event$ | async) as e; else loadingTpl">
    <div *ngIf="!e" class="mt-6 text-slate-600">
      No se encontró el evento.
    </div>

    <ng-container *ngIf="e">
      <!-- Cover -->
      <div *ngIf="e.coverUrl" class="mt-6 overflow-hidden rounded-3xl border border-slate-200">
        <img [src]="e.coverUrl" [alt]="e.title" class="w-full max-h-[420px] object-cover" />
      </div>

      <h1 class="mt-6 text-3xl md:text-4xl font-extrabold">
        {{ e.title }}
      </h1>

      <p class="mt-2 text-slate-600">
        {{ e.excerpt }}
      </p>

      <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="rounded-2xl border border-slate-200 p-5">
          <p class="text-xs uppercase tracking-widest text-slate-500">Fecha</p>
          <p class="mt-2 font-semibold">
            {{ e.startAt | date:'dd/MM/yyyy' }}
          </p>
        </div>

        <div class="rounded-2xl border border-slate-200 p-5">
          <p class="text-xs uppercase tracking-widest text-slate-500">Horario</p>
          <p class="mt-2 font-semibold">
            {{ e.startAt | date:'HH:mm' }} — {{ e.endAt ? (e.endAt | date:'HH:mm') : '—' }}
          </p>
        </div>

        <div class="rounded-2xl border border-slate-200 p-5">
          <p class="text-xs uppercase tracking-widest text-slate-500">Lugar</p>
          <p class="mt-2 font-semibold">
            {{ e.location || '—' }}
          </p>
        </div>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #loadingTpl>
    <p class="mt-6 text-slate-600">Cargando evento...</p>
  </ng-template>
</section>
